# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name blog.sponda.capital;
    return 301 https://blog.sponda.capital$request_uri;
}

server {
    listen 443 ssl http2;
    server_name blog.sponda.capital;

    ssl_certificate /etc/letsencrypt/live/blog.sponda.capital/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blog.sponda.capital/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/sponda/blog/public;
    index index.html;

    # Clean URLs: /foo → /foo/index.html; fall back to /foo.html if needed
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Aggressive cache for hashed/static assets
    location ~* \.(css|js|png|jpg|jpeg|svg|woff2|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The markdown twin of every post, which Hugo writes next to index.html.
    #
    # `default_type` rather than a `types` block: nginx's bundled mime.types
    # has no entry for .md, and a second `types` directive in this server
    # would collide with the one the http context already included. With the
    # extension unknown, nginx falls through to default_type, so naming it
    # here is enough and nothing else is disturbed.
    location ~* \.md$ {
        default_type text/markdown;
        # `charset` alone does nothing here: nginx only appends the charset to
        # types listed in charset_types, and the default list has no entry for
        # text/markdown. Without both directives the posts go out as
        # `text/markdown` with no charset, and an HTTP client that falls back
        # to latin-1 turns every "análise" into mojibake.
        charset_types text/markdown;
        charset utf-8;
        # One Cache-Control header, not two. `expires 1h` emits its own, which
        # alongside this add_header left two on every response.
        add_header Cache-Control "public, max-age=3600";
    }

    access_log /var/log/nginx/blog.sponda.capital-access.log;
    error_log /var/log/nginx/blog.sponda.capital-error.log;
}
