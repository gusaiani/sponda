# Redirect HTTP and www to https://sponda.capital
server {
    listen 80;
    server_name sponda.capital www.sponda.capital;
    return 301 https://sponda.capital$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.sponda.capital;

    ssl_certificate /etc/letsencrypt/live/sponda.capital/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sponda.capital/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://sponda.capital$request_uri;
}

server {
    listen 443 ssl http2;
    server_name sponda.capital;

    ssl_certificate /etc/letsencrypt/live/sponda.capital/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sponda.capital/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Who the visitor is, and who is allowed to say so.
    #
    # Django's client_ip() trusts CF-Connecting-IP to identify the visitor
    # behind the anonymous lookup cap. Nothing used to enforce that the header
    # actually came from Cloudflare: nginx passes unknown request headers
    # through untouched, so anyone reaching the origin IP directly could mint a
    # fresh identity per request and the cap stopped existing.
    #
    # This list makes the realip module resolve $remote_addr from
    # CF-Connecting-IP, but only for connections opening from a published
    # Cloudflare range. Off a direct connection the forged header is ignored
    # and $remote_addr stays the real peer. The proxy_set_header block below
    # then rebuilds every forwarding header from $remote_addr, so what Django
    # reads is nginx's value either way.
    include /etc/nginx/snippets/sponda-cloudflare-real-ip.conf;

    # Authenticated Origin Pulls: mTLS against Cloudflare's client certificate,
    # which refuses a direct connection at the handshake rather than merely
    # distrusting its headers. Off until someone runs
    # nginx/enable-cloudflare-origin-pull.sh, because it needs a CA file on the
    # box and a zone setting in the dashboard, and turning on either one
    # without the other is an outage.
    #
    # Wildcard, deliberately. An `include` of a literal missing path is a hard
    # `nginx -t` failure that would redden every deploy until the CA landed. A
    # mask that matches no files is simply empty.
    include /etc/nginx/snippets/sponda-origin-pull*.conf;

    # Server scope, so every location below inherits one copy.
    #
    # Watch this if you add a location: nginx inherits proxy_set_header from
    # the enclosing level only when the location declares *none* of its own.
    # A single proxy_set_header inside a location silently drops all five of
    # these, which for CF-Connecting-IP means reopening the spoofing hole.
    # Add the header here, or restate the whole set there.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # $remote_addr, not $proxy_add_x_forwarded_for: that variable *appends* to
    # the chain the peer sent, and client_ip() reads the leftmost entry, so the
    # peer got to choose its own address. There is exactly one hop in front of
    # this block, so there is no legitimate chain to preserve.
    proxy_set_header X-Forwarded-For $remote_addr;
    # Overwrite, do not forward. Without this the peer's own CF-Connecting-IP
    # reaches Django untouched.
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;

    # Serve logos directly from Django, bypassing Next.js middleware
    # (Next.js rewrite returns HTTP 500 for binary responses)
    location /api/logos/ {
        proxy_pass http://127.0.0.1:8710;
    }

    # The Django API, direct.
    #
    # This used to traverse Next on :3100, which rewrote it to Django in
    # middleware.ts. gunicorn's sync workers close the connection on every
    # response, and Node's HTTP client cannot reliably parse a bodyless
    # response that ends that way: it throws HPE_CLOSED_CONNECTION ("Data
    # after `Connection: close`") and Next answers 500.
    #
    # That made HEAD requests to /api/ fail about 90% of the time, measured
    # 2026-08-26 across several endpoints and every status code:
    #   HEAD /api/health/          13 of 15 -> 500
    #   HEAD /api/tickers/PETR4/   14 of 15 -> 500
    #   HEAD /api/tickers/NOPE99/  15 of 15 -> 500
    # GET was unaffected, which is why browsers never saw it and uptime
    # monitors and link checkers did.
    #
    # Removing the hop also drops a whole process from every API call. The
    # rewrite stays in middleware.ts because local development has no nginx.
    #
    # /api/logos/ above and /api/assistant/ask below keep their own blocks;
    # nginx matches the longest prefix, so they still win over this one.
    location /api/ {
        proxy_pass http://127.0.0.1:8710;
    }

    location /api/assistant/ask {
        proxy_pass http://127.0.0.1:8710;

        proxy_buffering off;     # don't hold the response back waiting to fill a buffer
        proxy_cache off;         # never cache a per-question stream
        proxy_read_timeout 120s; # a long GPT-4o answer can outlast the 60s default
    }

    # Open Graph images, rendered by Next under /og/. Next stamps every
    # app-router response with `Vary: rsc, next-router-state-tree, ...`,
    # which is how a browser and the client router share a URL for HTML.
    # On an image it is noise, and it was the one header shared by every
    # image X's crawler downloaded from this host and then declined to
    # render. Drop it here; nothing else about the response changes.
    location /og/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_hide_header Vary;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
    }

    access_log /var/log/nginx/sponda.capital-access.log;
    error_log /var/log/nginx/sponda.capital-error.log;
}
