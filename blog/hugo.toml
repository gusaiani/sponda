baseURL = "https://blog.sponda.capital/"
languageCode = "en"
defaultContentLanguage = "en"
title = "Sponda"
enableRobotsTXT = true
enableGitInfo = false
pagination.pagerSize = 50

[taxonomies]
  tag = "tags"
  category = "categories"

[permalinks]
  posts = "/:slug/"

[markup.goldmark.renderer]
  unsafe = true

[markup.tableOfContents]
  startLevel = 2
  endLevel = 3

[params]
  description = "Notes on stock investing."
  author = "Sponda"
  mainSiteURL = "https://sponda.capital"

# Every post is also served as plain markdown at its permalink plus
# `index.md`, matching the `.md` convention the main site uses. The source is
# already markdown, so this costs a template and nothing at runtime.
[outputFormats.Markdown]
  mediaType = "text/markdown"
  baseName = "index"
  isPlainText = true
  isHTML = false
  suffix = "md"
  permalinkable = true

[outputs]
  home = ["HTML", "RSS"]
  page = ["HTML", "Markdown"]
  section = ["HTML", "RSS"]
