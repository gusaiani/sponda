<!DOCTYPE html>
<html lang="{{ html_lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{{ title }} · Sponda</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 64px 20px;
      background: #f5f7fb;
      color: #0c1829;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.6;
    }
    .card {
      max-width: 480px;
      margin: 0 auto;
      padding: 40px;
      background: #ffffff;
      border-radius: 8px;
    }
    .wordmark {
      display: block;
      margin-bottom: 28px;
      font-size: 20px;
      font-weight: 500;
      letter-spacing: 1px;
      color: #1b347e;
      text-decoration: none;
    }
    h1 {
      margin: 0 0 14px;
      font-size: 22px;
      font-weight: 600;
      line-height: 1.3;
    }
    .message {
      margin: 0 0 28px;
      font-size: 15px;
      color: #5570a0;
      word-break: break-word;
    }
    .confirm-button {
      display: block;
      width: 100%;
      padding: 14px 24px;
      background: #1b347e;
      border: 0;
      border-radius: 6px;
      color: #ffffff;
      font-family: inherit;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
    }
    .confirm-button:hover { background: #16296a; }
    .note {
      margin: 20px 0 0;
      font-size: 13px;
      line-height: 1.6;
      color: #8a9bbd;
    }
    .footer {
      margin: 32px 0 0;
      padding-top: 20px;
      border-top: 1px solid #e8edf5;
      font-size: 13px;
      color: #8a9bbd;
    }
    .footer a { color: #1e40af; text-decoration: none; }
    .footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main class="card">
    <a class="wordmark" href="{{ home_url }}">SPONDA</a>

    <h1>{{ title }}</h1>
    <p class="message">{{ message }}</p>

    {% if shows_confirm_button %}
      <form method="post" action="">
        <button class="confirm-button" type="submit">{{ action_label }}</button>
      </form>
    {% endif %}

    {% if note %}
      <p class="note">{{ note }}</p>
    {% endif %}

    <p class="footer">
      <a href="{{ account_url }}">{{ account_action }}</a>
    </p>
  </main>
</body>
</html>
